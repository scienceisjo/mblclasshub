<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MBL 수업허브 · 발표 모드</title>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<script src="./lib/supabase-2.117.2.js"></script>
<script src="./lab-data.js?v=202610020902"></script>
<script src="./config.js?v=202610020902"></script>
<script src="./hub.js?v=202610020902"></script>
<!-- 그래프는 교사 화면·학생 대시보드와 같은 엔진으로 그립니다(둘째 축 · 계산 열 빼기 · 1·2·5 눈금 · 곡선 관계) -->
<script src="./dashkit.js?v=202610020902"></script>
<style>
  :root{
    --sky-1:#D4EDFB; --sky-2:#EAF8F0;
    --paper:#FFFFFF; --cream:#FFFDF6;
    --ink:#254753; --muted:#4F6A76;
    --mint:#20B2A6; --mint-d:#14867C; --mint-ink:#0F766E;
    --sun:#FFC130; --coral:#FF8C6B; --sky:#54B4E8;
    --line:#E4EFF1; --line-2:#D3E6EA;
    --shadow:0 10px 28px rgba(37,71,83,.09);
    --shadow-lg:0 18px 44px rgba(37,71,83,.14);
    --ok:#37B58C; --warn:#E8873C; --bad:#E05A5A;
    --g1:#20B2A6; --g2:#54B4E8; --g3:#FFC130; --g4:#FF8C6B; --g5:#8B7FD4; --g6:#4FB477; --g7:#E88FB5;
    --display:'Jua',sans-serif;
    --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
    --wrap:1120px; --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,#F4FBF6 100%);background-attachment:fixed;min-height:100vh}
  .hidden{display:none !important}
  .wrap{max-width:1840px;margin:0 auto;padding:0 28px}

  .offbar{background:rgba(255,193,48,.3);border-bottom:2px solid rgba(255,193,48,.7);color:#8A5B00;
    font-size:20px;font-weight:800;text-align:center;padding:10px}

  /* 연결 설정 안내 — 오프라인 배너와 색을 다르게 씁니다 */
  .setupbar{background:#FFF0EA;border-bottom:3px solid var(--coral);color:#A8421C;
    font-size:20px;font-weight:800;text-align:center;padding:12px}

  /* 전자칠판용 큰 머리글 */
  .phead{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
    padding:18px 0;border-bottom:2px solid var(--line-2)}
  .phead h1{font-family:var(--display);font-size:clamp(28px,3.2vw,52px);font-weight:400;line-height:1.15}
  .phead .sub{font-size:clamp(15px,1.2vw,22px);color:var(--muted);font-weight:600}
  .codebox{text-align:center;background:var(--cream);border:3px dashed var(--mint);border-radius:20px;padding:10px 26px}
  .codebox .lbl{font-size:15px;color:var(--muted);font-weight:700}
  .codebox .big{font-family:var(--display);font-size:clamp(34px,4vw,64px);letter-spacing:.12em;color:var(--mint-d);line-height:1.1}

  .phase{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);
    font-size:clamp(18px,1.8vw,30px);padding:8px 22px;border-radius:999px;background:rgba(32,178,166,.16);color:var(--mint-d)}
  .phase.share{background:rgba(84,180,232,.2);color:#2A7FB0}
  .phase.present{background:rgba(255,140,107,.22);color:#C9542F}
  .phase.done{background:rgba(255,193,48,.26);color:#9A6B00}

  /* 모둠 현황 띠 */
  .strip{display:flex;gap:12px;flex-wrap:wrap;padding:18px 0}
  .gchip{display:flex;align-items:center;gap:10px;border-radius:999px;padding:10px 20px;color:#132F38;
    font-family:var(--display);font-size:clamp(16px,1.5vw,26px);box-shadow:var(--shadow)}
  .gchip small{font-family:var(--sans);font-size:14px;font-weight:700;background:rgba(255,255,255,.6);border-radius:999px;padding:2px 10px}
  .gchip.off{background:#CFDDE2 !important;color:#6E8A96}

  /* 발표 장 표시줄 */
  .slidebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 0 12px}
  .slidebar .sind{font-family:var(--display);font-size:clamp(16px,1.4vw,24px);color:var(--muted);
    background:var(--cream);border:2px solid var(--line-2);border-radius:999px;padding:8px 20px}
  .slidebar .sbtn{font-family:var(--sans);font-size:clamp(16px,1.3vw,22px);font-weight:800;cursor:pointer;
    min-height:52px;padding:10px 26px;border-radius:999px;border:2px solid var(--sky);
    background:rgba(84,180,232,.16);color:#2A7FB0}
  .slidebar .sbtn:hover{background:rgba(84,180,232,.3)}

  /* 본문 */
  .stage{padding:14px 0 40px}
  .bigcard{background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-lg);padding:26px 30px;margin-bottom:20px}
  .bigcard h2{font-family:var(--display);font-size:clamp(24px,2.6vw,42px);font-weight:400;margin-bottom:6px}
  .bigcard .meta{color:var(--muted);font-size:clamp(14px,1.1vw,20px);font-weight:700;margin-bottom:12px}
  .chartbox{width:100%;overflow-x:auto}
  .chartbox svg{display:block;max-width:100%;height:auto}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:20px}
  .qa{border-left:8px solid var(--mint);background:#F7FDFC;border-radius:0 18px 18px 0;padding:16px 22px;margin-bottom:14px}
  .qa b{display:block;font-size:clamp(17px,1.4vw,26px);margin-bottom:6px}
  .qa p{font-size:clamp(16px,1.3vw,24px);color:#3C6070;white-space:pre-wrap}

  .rank{list-style:none}
  .rank li{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:14px 4px;
    font-size:clamp(17px,1.5vw,28px)}
  .rank .nm{font-family:var(--display);flex:1}
  .rank .st{color:var(--sun);font-size:clamp(20px,1.8vw,32px);letter-spacing:2px}
  .rank .cm{color:var(--muted);font-size:clamp(13px,1vw,18px);flex:1.4;text-align:right}

  .empty{color:var(--muted);font-size:clamp(16px,1.4vw,26px);text-align:center;padding:60px 20px}

  /* 반 전체 속 우리 모둠 — 모둠별 기울기 표 */
  .tblwrap{width:100%;overflow-x:auto}
  .ptbl{width:100%;border-collapse:collapse;font-size:clamp(15px,1.3vw,25px)}
  .ptbl th,.ptbl td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  .ptbl th{color:var(--muted);font-weight:700;font-size:clamp(13px,1.1vw,20px)}
  .ptbl tr.me td{background:#F0FBFA;font-weight:800}
  .swatch{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-2px;margin-right:8px}
  .sbtn.on{background:var(--mint);border-color:var(--mint);color:#fff}

  /* 코드 입력 */
  .askcode{max-width:560px;margin:70px auto;background:var(--paper);border:1px solid var(--line);
    border-radius:24px;box-shadow:var(--shadow-lg);padding:34px;text-align:center}
  .askcode h2{font-family:var(--display);font-size:30px;font-weight:400;margin-bottom:8px}
  .askcode input{width:100%;font-family:var(--display);font-size:44px;letter-spacing:.16em;text-align:center;
    padding:16px;border:2px solid var(--line-2);border-radius:16px;background:var(--cream);color:var(--ink);text-transform:uppercase}
  .askcode input:focus{border-color:var(--mint);outline:none}
  .askcode input::placeholder{color:#B9CBD1;opacity:1}          /* 보기 글자는 연하게 — 이미 적힌 코드로 보이지 않게 */
  .askcode h1{font-family:var(--display);font-size:clamp(22px,6.4vw,30px);font-weight:400;margin-bottom:8px;word-break:keep-all}
  .resume{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line-2);font-size:15px;color:var(--muted)}
  .resume .btn2{font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;border:1.5px solid var(--mint-ink);
    background:#fff;color:var(--mint-ink);padding:9px 18px;border-radius:999px;margin-top:8px}
  /* 나가는 길 — 위쪽에 눈에 띄지 않게 */
  .exitlink{position:fixed;top:8px;left:10px;z-index:60;font-size:13px;font-weight:700;color:var(--muted);
    background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:999px;padding:5px 12px;text-decoration:none;opacity:.75}
  .exitlink:hover,.exitlink:focus{opacity:1;color:var(--mint-ink)}
  body.showing #app-credit{display:none}                        /* 발표 중에는 꼬리말을 숨깁니다 */
  body.showing .phead{padding-top:34px}
  .btn{font-family:var(--sans);font-size:17px;font-weight:700;cursor:pointer;border:1.5px solid var(--mint-ink);
    background:var(--mint-ink);color:#fff;padding:13px 26px;border-radius:999px;margin-top:14px;box-shadow:var(--shadow)}
  .btn:hover{background:#0B5F58}
  .err{color:var(--bad);font-weight:700;min-height:22px;margin-top:10px}
  .live{font-size:14px;color:var(--muted);font-weight:700}
</style>
</head>
<body>

<a class="exitlink" href="./teacher.html">← 교사 화면으로</a>
<div id="offbar" class="offbar hidden" role="status">연결이 끊겨 마지막으로 받은 화면을 보여 주고 있습니다.</div>
<div id="setupbar" class="setupbar hidden" role="status"></div>

<!-- 코드 입력 -->
<section id="ask" class="askcode">
  <h1>MBL 수업허브 · 발표 화면</h1>
  <p style="color:var(--muted)">이 수업의 참여코드 6자리를 입력하세요.</p>
  <input id="inCode" type="text" maxlength="6" placeholder="ABC234" autocomplete="off" aria-label="참여코드" />
  <div id="askErr" class="err" role="alert"></div>
  <button id="btnGo" class="btn" type="button">발표 화면 열기</button>
  <div id="resume" class="resume hidden"></div>
</section>

<!-- 발표 화면 -->
<div id="screen" class="hidden">
  <div class="wrap">
    <div class="phead">
      <div>
        <h1 id="pTitle">수업</h1>
        <div class="sub" id="pSub"></div>
      </div>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <span id="pPhase" class="phase">데이터 수집 중</span>
        <div class="codebox">
          <div class="lbl">참여코드</div>
          <div id="pCode" class="big">------</div>
        </div>
      </div>
    </div>
    <div id="pStrip" class="strip"></div>
    <div id="pSlideBar" class="slidebar hidden"></div>
  </div>
  <div class="wrap stage">
    <div id="pStage"></div>
    <div class="live" id="pLive"></div>
  </div>
</div>

<footer id="app-credit" style="width:100%;box-sizing:border-box;margin:2.5rem 0 0;padding:14px 12px;text-align:center;font-size:12.5px;line-height:1.6;color:#55606B;font-family:system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;border-top:1px solid rgba(128,128,128,.25);">© 2026 MBL 수업허브<span id="creditWho"></span></footer>

<script>
(function(){
  'use strict';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = id => document.getElementById(id);
  const SERIES_COLORS = ['var(--mint)','var(--coral)','var(--sky)','var(--sun)','var(--g5)','var(--g6)','var(--g7)'];
  const PHASE_TEXT = { collect:'① 데이터 수집 중', share:'② 모둠 공유 중', present:'③ 발표 중', done:'④ 마무리' };
  //  교사 화면(teacher.html)이 보내는 slide_idx 0·1·2 는 뜻이 바뀌지 않습니다.
  //  '예상 vs 실제' 는 발표 모둠이 예상을 그렸을 때만 맨 뒤(3)에 붙습니다.
  //  '반 전체 속 우리 모둠' 도 자료가 두 모둠 이상 모였을 때만 그 뒤에 붙습니다.
  //  붙는 장이 없으면 목록이 세 장 그대로라 앞 장들의 번호가 어긋나지 않습니다.
  const SLIDES      = ['모둠 그래프', '보고서', '별점 모아 보기'];
  const PRED_SLIDE  = '예상 vs 실제';
  const CLASS_SLIDE = '반 전체 속 우리 모둠';
  //  뒤에 붙는 장을 칠판에서 바로 열어 보는 단추 이름
  const EXTRA_BTN = {};
  EXTRA_BTN[PRED_SLIDE]  = '📈 예상 vs 실제 보기';
  EXTRA_BTN[CLASS_SLIDE] = '👥 반 전체 속 우리 모둠';

  let joinCode = '';
  let board    = null;
  let unwatch  = null;
  //  전자칠판에서만 잠깐 넘겨 본 장. 선생님이 장·발표 모둠을 바꾸면 곧바로 풀립니다.
  let localSlide  = null;
  let lastSlideRx = null;
  let lastPresent = null;
  //  '반 전체 속 우리 모둠' 에서 어떤 계열로 볼지 (계열이 둘 이상일 때만 단추가 나옵니다)
  let classSi = 0;

  //  칸 읽기 — hub.js 와 같은 규칙('20.1 ℃' → 20.1, 빈 칸 → NaN)을 씁니다.
  const cell = (window.Hub && typeof Hub.cellAt === 'function')
    ? function(row, c){ return Hub.cellAt(row, c); }
    : function(row, c){
        if (row === null || row === undefined) return NaN;
        const raw = Array.isArray(row) ? row[c]
                  : (typeof row === 'object' ? (c === 0 ? row.x : row['s' + (c - 1)]) : null);
        if (raw === '' || raw === null || raw === undefined) return NaN;
        const v = Number(raw);
        return isFinite(v) ? v : NaN;
      };
  function rawOf(row){
    if (Array.isArray(row)) return row[0];
    if (row && typeof row === 'object') return row.x;
    return '';
  }
  //  빈 칸·null 을 0 으로 오해하지 않게 따로 봅니다.
  function isNum(v){
    return v !== null && v !== undefined && v !== '' && isFinite(Number(v));
  }
  //  숫자를 사람이 읽기 좋게 (자릿수가 클수록 소수점을 줄입니다)
  function fmt(v){
    if (!isNum(v)) return '—';
    const n = Number(v);
    const a = Math.abs(n);
    return String(Number(n.toFixed(a >= 100 ? 0 : (a >= 10 ? 1 : 2))));
  }

  // ── 전자칠판용 큰 인라인 SVG 그래프 ────────────────────────────
  //  교사 화면·학생 대시보드와 같은 엔진(DashKit.chartSVG)으로, 글자만 크게 그립니다.
  //  opt.predict(예상 · 점선) · opt.asPredict(rows 가 곧 예상) · opt.mark(가장 크게 빗나간 곳)
  function chartSVG(sp, rows, opt){
    opt = opt || {};
    if (!(window.DashKit && typeof DashKit.chartSVG === 'function')){
      return '<div class="empty">그래프 엔진(dashkit.js)을 불러오지 못했습니다.</div>';
    }
    const o = { w: opt.w || 1000, h: opt.h || 520, font: opt.font || 20, colors: SERIES_COLORS,
                predict: opt.predict, asPredict: !!opt.asPredict, gap: false, markColor: 'var(--bad)' };
    if (opt.mark) o.mark = opt.mark;
    return DashKit.chartSVG(sp, rows, o);
  }

  //  연결이 끊겼다는 띠는 한 번이라도 화면을 받은 뒤에만 띄웁니다(받은 것이 없는데 「마지막 화면」이라고 하면 틀립니다).
  let gotBoard = false, netOff = false;
  function paintOffbar(){
    const blocked = !!$('blocked') && !$('blocked').classList.contains('hidden');
    $('offbar').classList.toggle('hidden', !(netOff && gotBoard && !blocked));
  }
  Hub.onStatus(function(st){ netOff = !!(st && st.offline); paintOffbar(); });

  // ── 연결 설정 안내 (전자칠판이라 한 줄만) ──────────────────────
  (function checkSetup(){
    const bar = $('setupbar');
    function tell(msg){
      //  큰 안내 화면(blockScreen)이 떠 있으면 같은 말을 두 번 하지 않습니다.
      if ($('blocked') && !$('blocked').classList.contains('hidden')) return;
      bar.textContent = msg; bar.classList.remove('hidden');
    }
    const NO_CONF = 'config.js 에 우리 학교 Supabase 정보가 아직 없습니다. 선생님께 알려 주세요.';
    const NO_SQL  = 'Supabase SQL Editor 에서 schema.sql 을 한 번 실행해 주세요. 선생님께 알려 주세요.';

    if (typeof Hub.isConfigured === 'function' && !Hub.isConfigured()){ tell(NO_CONF); return; }
    if (typeof Hub.diagnose !== 'function') return;
    Promise.resolve(Hub.diagnose()).then(function(d){
      if (!d) return;
      if (!d.configured) tell(NO_CONF);
      else if (d.reachable && !d.schemaOk) tell(NO_SQL);
      // 연결만 안 되는 경우는 위쪽 오프라인 배너가 알려 줍니다.
    }, function(){});
  })();

  // ── 화면 그리기 ────────────────────────────────────────────────
  function gname(g){ return g ? (g.group_name || (g.group_no + '모둠')) : ''; }
  function gcolor(g){ return 'var(--g' + (((Number(g.group_no) - 1) % 7) + 1) + ')'; }

  function render(b, info){
    board = b || { lesson:null, groups:[], data:[], reports:[], feedback:[] };
    $('ask').classList.add('hidden');
    $('screen').classList.remove('hidden');
    document.body.classList.add('showing');
    if (board.lesson) gotBoard = true;
    paintOffbar();

    const l = board.lesson;
    if (!l){
      $('pTitle').textContent = '수업 정보를 기다리는 중';
      $('pSub').textContent   = '참여코드 ' + joinCode;
      $('pCode').textContent  = joinCode || '------';
      $('pStrip').innerHTML   = '';
      $('pStage').innerHTML   = '<div class="bigcard"><div class="empty">수업 정보를 받는 중입니다. 연결되면 이 화면이 저절로 채워집니다.</div></div>';
      return;
    }

    $('pTitle').textContent = l.title || '수업';
    $('pSub').textContent   = [l.class_label, (l.exp_title && l.exp_title !== l.title) ? l.exp_title : '',
                               l.teacher_name ? l.teacher_name + ' 선생님' : ''].filter(Boolean).join(' · ');
    $('pCode').textContent  = l.join_code || joinCode;
    const ph = $('pPhase');
    ph.className = 'phase ' + (l.phase || 'collect');
    ph.textContent = PHASE_TEXT[l.phase] || '수업 중';
    // 단계에 따라 확인 간격이 달라집니다(발표 3초 · 공유 8초 · 그 밖 15초).
    $('pLive').textContent = (info && info.mode === 'cache' ? '저장해 둔 화면' : '자동으로 새로 고치는 중') +
                             ' · 마지막 갱신 ' + new Date().toLocaleTimeString('ko-KR');

    const dataBy = {}, repBy = {};
    (board.data || []).forEach(d => { dataBy[d.group_id] = d; });
    (board.reports || []).forEach(r => { repBy[r.group_id] = r; });

    // 모둠 현황 띠
    $('pStrip').innerHTML = (board.groups || []).map(function(g){
      const d = dataBy[g.id], r = repBy[g.id];
      const on = !!d || !!r;
      return '<span class="gchip' + (on ? '' : ' off') + '" style="background:' + gcolor(g) + '">' +
             esc(gname(g)) + '<small>' + (d ? ((d.rows || []).length + '줄') : '대기') +
             (r && r.status === 'done' ? ' · 제출' : '') + '</small></span>';
    }).join('') || '<span class="gchip off">아직 들어온 모둠이 없습니다</span>';

    const spec = (l.data_spec && l.data_spec.series) ? l.data_spec
               : (labSpec(l) || { x:{label:'x',unit:''}, series:[{label:'값',unit:''}], rows:8, chart:'line' });
    const presenter = (board.groups || []).filter(g => g.id === l.presenter_group)[0] || null;

    // 발표 모둠이 정해지지 않았거나 수집 단계면 전체 보기
    if (!presenter || l.phase === 'collect'){
      slideBar(null);
      $('pStage').innerHTML = (l.phase === 'done' ? quizSummaryHTML() : '') + allGroupsHTML(spec, dataBy, repBy);
      return;
    }

    // 발표 모둠이 예상을 그렸으면 '예상 vs 실제' 한 장이 맨 뒤에 붙습니다.
    const pd  = dataBy[presenter.id];
    const pre = (pd && Array.isArray(pd.predict)) ? pd.predict : [];
    const ns  = (Array.isArray(spec.series) && spec.series.length) ? spec.series.length : 1;
    let hasPre = false;                                            // 쓸 수 있는 예상 점이 하나라도 있을 때만
    pre.forEach(function(r){ for (let i = 1; i <= ns; i++) if (isNum(cell(r, i))) hasPre = true; });
    const list = SLIDES.slice();
    if (hasPre) list.push(PRED_SLIDE);
    //  견줄 상대가 있어야 뜻이 있으므로 자료가 두 모둠 미만이면 이 장은 아예 만들지 않습니다.
    if (classCount(spec, dataBy) >= 2) list.push(CLASS_SLIDE);

    const rx = Math.max(0, Number(l.slide_idx) || 0);
    if (rx !== lastSlideRx || presenter.id !== lastPresent){   // 선생님이 움직이면 이 화면의 임시 이동은 풀립니다
      localSlide = null; lastSlideRx = rx; lastPresent = presenter.id;
    }
    let slide = Math.min(list.length - 1, rx);
    if (localSlide !== null && localSlide >= 0 && localSlide < list.length) slide = localSlide;
    slideBar(list, slide);

    const name = list[slide];
    if (name === PRED_SLIDE)       $('pStage').innerHTML = presentPredictHTML(spec, presenter, pd, pre);
    else if (name === CLASS_SLIDE) $('pStage').innerHTML = presentClassHTML(spec, presenter, dataBy);
    else if (name === SLIDES[1])   $('pStage').innerHTML = presentReportHTML(l, presenter, repBy);
    else if (name === SLIDES[2])   $('pStage').innerHTML = feedbackHTML();
    else                           $('pStage').innerHTML = presentChartHTML(spec, presenter, dataBy);
  }

  //  발표 장 표시줄. 뒤에 붙은 장(예상 vs 실제 · 반 전체)이 있을 때만 넘기는 단추가 함께 나옵니다
  //  (교사 화면이 세 장까지만 보내는 경우에도 칠판에서 바로 열어 볼 수 있게).
  function slideBar(list, slide){
    const bar = $('pSlideBar');
    if (!bar) return;
    if (!list){ bar.classList.add('hidden'); bar.innerHTML = ''; return; }
    bar.classList.remove('hidden');
    let h = '<span class="sind">' + (slide + 1) + ' / ' + list.length + ' · ' + esc(list[slide]) + '</span>';
    list.forEach(function(nm, i){
      if (i < SLIDES.length || i === slide) return;          // 기본 세 장은 선생님 화면이 넘깁니다
      h += '<button class="sbtn" type="button" data-go="' + i + '">' + esc(EXTRA_BTN[nm] || nm) + '</button>';
    });
    if (slide >= SLIDES.length){
      h += '<button class="sbtn" type="button" data-go="back">발표 화면으로 돌아가기</button>';
    }
    bar.innerHTML = h;
  }

  function labSpec(l){
    try { return (window.LAB && l.exp_id && LAB.byId(l.exp_id)) ? LAB.byId(l.exp_id).dataSpec : null; }
    catch (e) { return null; }
  }

  function allGroupsHTML(spec, dataBy, repBy){
    const cards = (board.groups || []).map(function(g){
      const d = dataBy[g.id], r = repBy[g.id];
      return '<div class="bigcard"><h2 style="color:' + gcolor(g) + '">' + esc(gname(g)) + '</h2>' +
             '<div class="meta">' + (d ? '데이터 ' + ((d.rows || []).length) + '줄' : '데이터 없음') +
             (r ? ' · ' + (r.status === 'done' ? '보고서 제출' : '보고서 작성 중') : '') +
             (d && d.note ? ' · ' + esc(d.note) : '') + '</div>' +
             '<div class="chartbox">' + (d ? chartSVG(spec, d.rows, { w: 900, h: 400, font: 17 }) :
               '<div class="empty">아직 자료가 없습니다.</div>') + '</div></div>';
    }).join('');
    return '<div class="grid2">' + (cards || '<div class="bigcard"><div class="empty">모둠이 데이터를 저장하면 여기에 그래프가 나타납니다.</div></div>') + '</div>';
  }

  function presentChartHTML(spec, g, dataBy){
    const d = dataBy[g.id];
    return '<div class="bigcard"><h2 style="color:' + gcolor(g) + '">' + esc(gname(g)) + ' · 측정 결과</h2>' +
           '<div class="meta">' + (d && d.note ? '메모 · ' + esc(d.note) : '지금 발표하는 모둠입니다') + '</div>' +
           '<div class="chartbox">' + (d ? chartSVG(spec, d.rows) : '<div class="empty">아직 자료가 없습니다.</div>') + '</div></div>';
  }

  //  예상 vs 실제 — 예상은 점선, 가장 크게 빗나간 곳은 큰 동그라미로 표시합니다.
  function presentPredictHTML(spec, g, d, pre){
    const rows   = (d && Array.isArray(d.rows)) ? d.rows : [];
    const series = (spec && Array.isArray(spec.series) && spec.series.length) ? spec.series : [{ label:'값', unit:'' }];
    const xLab   = (spec && spec.x && spec.x.label) ? spec.x.label : 'x';
    const gapOf  = (typeof Hub.predictGap === 'function') ? Hub.predictGap : null;

    let head = '<div class="bigcard"><h2 style="color:' + gcolor(g) + '">' + esc(gname(g)) + ' · 예상 vs 실제</h2>';

    // 아직 측정값이 없으면 예상만 보여 줍니다(실험은 그대로 진행됩니다).
    let hasReal = false;
    rows.forEach(function(r){ for (let i = 0; i < series.length; i++) if (isFinite(cell(r, i + 1))) hasReal = true; });
    if (!hasReal){
      return head + '<div class="meta">먼저 그린 예상입니다. 측정값이 저장되면 여기에 겹쳐서 보여 줍니다.</div>' +
             '<div class="chartbox">' + chartSVG(spec, pre, { asPredict: true }) + '</div></div>';
    }

    const gaps = [];
    series.forEach(function(se, si){
      const gp = gapOf ? gapOf(rows, pre, si) : { n:0, maxDiff:null, atX:null, predicted:null, actual:null, meanDiff:null };
      if (gp && gp.maxDiff !== null) gaps.push({ si: si, se: se, gp: gp });
    });
    let worst = null;
    gaps.forEach(function(o){ if (!worst || o.gp.maxDiff > worst.gp.maxDiff) worst = o; });

    const mark = worst ? {
      x: worst.gp.atX, predicted: worst.gp.predicted, actual: worst.gp.actual, si: worst.si,
      text: '가장 큰 차이 ' + fmt(worst.gp.maxDiff) + (worst.se.unit ? ' ' + worst.se.unit : '')
    } : null;

    let h = head + '<div class="meta">점선이 우리 모둠의 예상, 진한 점·선이 실제 측정값입니다.</div>' +
            '<div class="chartbox">' + chartSVG(spec, rows, { predict: pre, mark: mark }) + '</div>';

    if (!gaps.length){
      return h + '<div class="qa"><b>예상과 견줄 수 있는 값이 아직 모자랍니다.</b><p>측정값을 더 저장하면 차이를 짚어 줍니다.</p></div></div>';
    }
    h += '<div class="qa"><b>예상과 가장 많이 달랐던 곳</b><p>';
    gaps.forEach(function(o){
      const u = o.se.unit ? ' ' + o.se.unit : '';
      h += esc((o.se.label || ('계열' + (o.si + 1))) + ' — ' + xLab + ' ' + fmt(o.gp.atX) + ' 에서 ' +
               '예상 ' + fmt(o.gp.predicted) + u + ', 실제 ' + fmt(o.gp.actual) + u +
               ' (차이 ' + fmt(o.gp.maxDiff) + u + ' · 평균 차이 ' + fmt(o.gp.meanDiff) + u + ')') + '\n';
    });
    h += '</p></div>';
    h += '<div class="qa" style="border-left-color:var(--coral);background:#FFF7F4"><b>왜 그렇게 달랐을까요?</b>' +
         '<p>예상과 어긋난 까닭을 모둠이 말해 봅시다.</p></div>';
    return h + '</div>';
  }

  //  개념 확인(개인별) 반 전체 결과 한 줄 — 아무도 응시하지 않았으면 아예 나오지 않습니다.
  function quizSummaryHTML(){
    const list = ((board && board.quiz) || []).filter(function(q){ return Number(q.max_score) > 0; });
    if (!list.length) return '';
    let sc = 0, mx = 0;
    list.forEach(function(q){ sc += Number(q.score) || 0; mx += Number(q.max_score) || 0; });
    if (!mx) return '';
    const rate = Math.round(sc / mx * 100);
    return '<div class="bigcard"><h2>개념 확인 · 반 전체 결과</h2>' +
           '<div class="meta">개인별로 푼 문항입니다. 이름은 칠판에 나오지 않습니다.</div>' +
           '<p style="font-size:clamp(20px,2vw,34px);font-weight:800">' +
           esc(list.length + '명 응시 · 반 전체 정답률 ' + rate + '% (평균 ' +
               fmt(sc / list.length) + ' / ' + fmt(mx / list.length) + '문항)') + '</p></div>';
  }

  function presentReportHTML(l, g, repBy){
    const r = repBy[g.id];
    const qs  = (l.form && Array.isArray(l.form.questions)) ? l.form.questions : [];
    const ans = (r && r.answers && typeof r.answers === 'object') ? r.answers : {};
    let h = '<div class="bigcard"><h2 style="color:' + gcolor(g) + '">' + esc(gname(g)) + ' · 보고서</h2>';
    //  답은 번호가 아니라 문항 글로 이어 붙입니다(Hub 가 하는 일) —
    //  선생님이 ▲▼ 로 차례를 바꾸거나 문항을 지워도 답이 옮겨 가지 않습니다.
    const used = {};
    const vals = (typeof Hub.alignAnswers === 'function') ? Hub.alignAnswers(ans, qs, used) : [];
    const rows = qs.map(function(q, i){
      return { q: (q && (q.q || q.text)) || ('질문 ' + (i + 1)), a: vals[i] };
    });
    //  __analysis 처럼 밑줄 두 개로 시작하는 열쇠는 화면이 저장해 둔 기록입니다(보고서 문항이 아닙니다).
    Object.keys(ans).filter(function(k){
      return String(k).slice(0, 2) !== '__' && !used[k];
    }).sort(function(a, b){
      return (parseInt(a.replace(/\D/g, ''), 10) || 0) - (parseInt(b.replace(/\D/g, ''), 10) || 0);
    }).forEach(function(k){
      rows.push({ q: /^q\d+$/.test(k) ? ('질문 ' + k.replace(/\D/g, '')) : k, a: ans[k] });
    });
    const shown = rows.filter(function(x){ return x.a !== '' && x.a !== null && x.a !== undefined; });
    if (!shown.length){
      h += '<div class="empty">아직 제출한 내용이 없습니다.</div></div>';
      return h;
    }
    shown.forEach(function(x){
      h += '<div class="qa"><b>' + esc(x.q) + '</b><p>' + esc(x.a) + '</p></div>';
    });
    return h + '</div>';
  }

  function feedbackHTML(){
    const sum = {};
    (board.feedback || []).forEach(function(f){
      sum[f.to_group] = sum[f.to_group] || { n:0, s:0, cm:[] };
      sum[f.to_group].n++; sum[f.to_group].s += Number(f.stars) || 0;
      if (f.comment) sum[f.to_group].cm.push(f.comment);
    });
    const rows = (board.groups || []).map(function(g){
      const v = sum[g.id];
      return { g: g, avg: v ? v.s / v.n : 0, n: v ? v.n : 0, cm: v ? v.cm : [] };
    }).sort((a, b) => b.avg - a.avg);
    if (!rows.length || !rows[0].n){
      return '<div class="bigcard"><h2>모둠 별점</h2><div class="empty">아직 별점이 들어오지 않았습니다.</div></div>' + quizSummaryHTML();
    }
    let h = '<div class="bigcard"><h2>모둠 별점 모아 보기</h2><ul class="rank">';
    rows.forEach(function(r){
      const full = Math.round(r.avg);
      h += '<li><span class="nm" style="color:' + gcolor(r.g) + '">' + esc(gname(r.g)) + '</span>' +
           '<span class="st">' + '★'.repeat(full) + '☆'.repeat(Math.max(0, 5 - full)) + '</span>' +
           '<span class="cm">' + (r.n ? r.avg.toFixed(1) + '점 · ' + r.n + '표' : '아직 없음') +
           (r.cm.length ? '<br>“' + esc(r.cm[r.cm.length - 1]) + '”' : '') + '</span></li>';
    });
    return h + '</ul></div>' + quizSummaryHTML();
  }

  // ═══════════════════════════════════════════════════════════════
  //  반 전체 속 우리 모둠 — 모든 모둠의 점을 한 산점도에, 발표 모둠만 크게.
  //  기울기·절편·R² 는 Hub.stats 로만 계산합니다(따로 구현하지 않습니다).
  // ═══════════════════════════════════════════════════════════════

  //  아주 작거나 큰 값도 읽히게 (0.00012 → 1.2e-4 대신 사람이 읽는 자리수로)
  function pnum(v){
    const n = Number(v);
    if (v === null || v === undefined || !isFinite(n)) return '—';
    if (n === 0) return '0';
    const a = Math.abs(n);
    if (a < 1e-3 || a >= 1e6) return String(Number(n.toExponential(2)));
    return String(Number(n.toPrecision(4)));
  }
  function pr2(v){
    if (v === null || v === undefined || !isFinite(v)) return '—';
    return (Math.abs(v) >= 0.995) ? Number(v).toFixed(3) : Number(v).toFixed(2);
  }
  //  기울기의 단위 = 세로축 단위 ÷ 가로축 단위
  //  (교사 화면·대시보드와 같은 규칙 — 1/cm² 처럼 뒤집힌 단위는 곱으로 적습니다)
  function pSlopeUnit(yu, xu){
    if (window.DashKit && DashKit.slopeUnit) return DashKit.slopeUnit(yu, xu);
    if (yu && xu) return yu + '/' + xu;
    if (yu) return yu;
    if (xu) return '1/' + xu;
    return '';
  }
  //  rel 이 있으면 바꾼 축(예: 1/부피)에서 맞춥니다 — 곡선 관계에 직선을 긋지 않게.
  function pFit(pts, rel){
    const arr = (pts || []).map(function(p){ return [p.x, p.y]; });
    if (rel && window.DashKit && DashKit.curveFit){
      const c = DashKit.curveFit(arr, rel);
      return c ? Object.assign(c, { ok: c.n >= 2 }) : { n:0, slope:null, intercept:null, r2:null, ok:false };
    }
    const st = (window.Hub && typeof Hub.stats === 'function')
      ? Hub.stats(arr, 0)
      : { n:0, slope:null, intercept:null, r2:null };
    st.ok = (st.n >= 2 && st.slope !== null && isFinite(st.slope));
    return st;
  }

  //  자료를 낸 모둠 수 — 두 모둠 미만이면 이 장은 만들지 않습니다.
  function classCount(spec, dataBy){
    const ns = (spec && Array.isArray(spec.series) && spec.series.length) ? spec.series.length : 1;
    let n = 0;
    (board.groups || []).forEach(function(g){
      const d = dataBy[g.id];
      const rows = (d && Array.isArray(d.rows)) ? d.rows : [];
      let ok = false;
      rows.forEach(function(r){ for (let i = 1; i <= ns; i++) if (isFinite(cell(r, i))) ok = true; });
      if (ok) n++;
    });
    return n;
  }

  //  모둠별 (x, y) 점 묶음. 가로축이 글자면 줄 순번을 가로축으로 씁니다(Hub.stats 와 같은 규칙).
  //  가로축이 이름(자리·조건)인가 — 막대그래프인데 가로축 단위가 없거나, 숫자로 못 읽는 가로축 값이 있으면
  function classCats(spec, dataBy){
    let cat = !!(spec && spec.chart === 'bar' && !(spec.x && spec.x.unit));
    const out = [];
    (board.groups || []).forEach(function(g){
      const d = dataBy[g.id];
      ((d && Array.isArray(d.rows)) ? d.rows : []).forEach(function(r, i){
        const t = String(rawOf(r) == null ? '' : rawOf(r)).trim();
        if (t && !isFinite(cell(r, 0))) cat = true;
        const key = t || String(i + 1);
        if (out.indexOf(key) < 0) out.push(key);
      });
    });
    if (!cat) return null;
    if (out.every(function(c){ return isFinite(Number(c)); })) out.sort(function(a, b){ return Number(a) - Number(b); });
    return out;
  }
  //  곡선 관계(보일 법칙 따위) — 분석 레시피의 fit 을 봅니다(DashKit.relOf)
  function classRel(si){
    const l = board && board.lesson;
    const e = (window.LAB && l && l.exp_id) ? LAB.byId(l.exp_id) : null;
    return (e && window.DashKit && DashKit.relOf) ? DashKit.relOf(e, si) : null;
  }
  function classParts(spec, presenter, dataBy, si, cats, rel){
    const series = (spec && Array.isArray(spec.series) && spec.series.length) ? spec.series : [{ label:'값', unit:'' }];
    const k = Math.max(0, Math.min(series.length - 1, Number(si) || 0));
    const parts = [];
    (board.groups || []).forEach(function(g){
      const d = dataBy[g.id];
      const rows = (d && Array.isArray(d.rows)) ? d.rows : [];
      const pts = [];
      rows.forEach(function(r, i){
        const y = cell(r, k + 1);
        if (!isFinite(y)) return;
        if (cats){
          const t = String(rawOf(r) == null ? '' : rawOf(r)).trim() || String(i + 1);
          pts.push({ x: cats.indexOf(t), y: y });
          return;
        }
        const x = cell(r, 0);
        if (!isFinite(x)) return;                 // 가로축 값이 없는 줄은 줄 번호로 바꾸지 않습니다(가짜 기울기)
        pts.push({ x: x, y: y });
      });
      if (!pts.length) return;
      parts.push({
        id: g.id, name: gname(g), color: gcolor(g),
        mine: !!(presenter && g.id === presenter.id),
        pts: pts, fit: cats ? { ok: false } : pFit(pts, rel)
      });
    });
    return { series: series, k: k, parts: parts };
  }

  function presentClassHTML(spec, presenter, dataBy){
    const series0 = (spec && Array.isArray(spec.series) && spec.series.length) ? spec.series : [{ label:'값', unit:'' }];
    const kk     = Math.max(0, Math.min(series0.length - 1, Number(classSi) || 0));
    const cats   = classCats(spec, dataBy);
    const rel    = cats ? null : classRel(kk);
    const info   = classParts(spec, presenter, dataBy, kk, cats, rel);
    const parts  = info.parts;
    const se     = info.series[info.k] || { label:'값', unit:'' };
    const yUnit  = se.unit || '';
    const xUnit  = (spec && spec.x && spec.x.unit) || '';
    const xName  = (spec && spec.x && spec.x.label) || '가로축';
    const yName  = se.label || '값';
    const TF     = (window.DashKit && DashKit.TF) || null;

    let h = '<div class="bigcard"><h2>반 전체 속 <span style="color:' + gcolor(presenter) + '">' +
            esc(gname(presenter)) + '</span></h2>';

    // 계열이 둘 이상이면 무엇으로 볼지 칠판에서 고릅니다.
    if (info.series.length > 1){
      h += '<div class="slidebar" style="padding:4px 0 10px">';
      info.series.forEach(function(s, i){
        h += '<button class="sbtn' + (i === info.k ? ' on' : '') + '" type="button" data-series="' + i + '">' +
             esc(s.label || ('계열 ' + (i + 1))) + '</button>';
      });
      h += '</div>';
    }

    if (parts.length < 2){
      return h + '<div class="empty">이 계열은 아직 한 모둠만 값을 냈습니다. 다른 계열을 고르거나 저장을 기다려 주세요.</div></div>';
    }

    const mine    = parts.filter(function(p){ return p.mine; })[0] || null;
    let allPts = [];
    parts.forEach(function(p){ allPts = allPts.concat(p.pts); });
    const allFit  = cats ? { ok: false } : pFit(allPts, rel);
    const relTxt  = (rel && TF) ? (TF[rel.yt].lab(yName) + ' ∝ ' + TF[rel.xt].lab(xName)) : '';

    const sets = parts.map(function(p){
      return { label: p.name + (p.mine ? ' (발표)' : ''), color: p.color, pts: p.pts.map(function(q){ return [q.x, q.y]; }),
               big: p.mine, faint: !p.mine,
               fit: (!rel && p.mine && p.fit.ok) ? p.fit : null, curve: (rel && p.mine && p.fit.ok) ? p.fit : null };
    });

    h += '<div class="meta">' + esc(mine
          ? ('표본이 ' + gname(presenter) + ' ' + mine.pts.length + '개에서 반 전체 ' + allPts.length + '개로 늘었습니다 (' + parts.length + '모둠)')
          : ('반 전체 ' + allPts.length + '개 (' + parts.length + '모둠) · 발표 모둠은 아직 이 계열의 값이 없습니다')) + '</div>';
    h += '<div class="chartbox">' + (window.DashKit && DashKit.multiChart ? DashKit.multiChart(sets, {
           xLabel: xName, xUnit: xUnit, yLabel: yName, yUnit: yUnit, w: 1180, h: 560, font: 20, mineWord: '',
           cats: cats, allFit: (!rel && allFit.ok) ? allFit : null, allCurve: (rel && allFit.ok) ? allFit : null,
           allLabel: rel ? ('반 전체 추세 곡선 (' + relTxt + ')') : '굵은 선 = 반 전체 추세선',
           meanLabel: '굵은 가로 막대 = ' + xName + '마다 반 평균'
         }) : '<div class="empty">그래프 엔진(dashkit.js)을 불러오지 못했습니다.</div>') + '</div>';

    if (cats){
      //  가로축이 이름이면 기울기를 내지 않습니다 — 자리마다 평균을 견줍니다.
      h += '<div class="qa"><b>' + esc(xName) + '마다 견주어 보기</b><p>' +
           esc('가로축이 이름이라 점을 선으로 잇거나 기울기를 내지 않았습니다. 굵은 가로 막대가 ' + xName + '마다 반 평균입니다.') + '</p></div>';
      return h + '<div class="qa" style="border-left-color:var(--coral);background:#FFF7F4"><b>같은 자리인데 값이 다른 까닭은 무엇일까요?</b>' +
             '<p>재는 시각 · 기기 · 그때 난 소리 가운데 무엇이 달랐는지 이야기해 봅시다.</p></div></div>';
    }

    // 기울기 순위 — 큰 것부터 (곡선 관계면 바꾼 축의 기울기)
    const ranked = parts.filter(function(p){ return p.fit.ok; }).slice()
                        .sort(function(a, b){ return b.fit.slope - a.fit.slope; });
    let rankTxt = '';
    if (mine && mine.fit.ok){
      const at = ranked.map(function(p){ return p.id; }).indexOf(mine.id);
      if (at >= 0) rankTxt = gname(presenter) + ' 의 기울기는 ' + ranked.length + '모둠 가운데 ' + (at + 1) + '번째로 큽니다.';
    }
    const su = (rel && TF) ? pSlopeUnit(TF[rel.yt].unit(yUnit), TF[rel.xt].unit(xUnit)) : pSlopeUnit(yUnit, xUnit);
    const sWord = (rel && TF) ? ('기울기(' + TF[rel.xt].lab(xName) + ' 기준)') : '기울기';
    h += '<div class="qa"><b>반 전체를 하나로 봤을 때</b><p>' +
         esc(sWord + ' ' + pnum(allFit.slope) + (su ? ' ' + su : '') +
             ' · 절편 ' + pnum(allFit.intercept) + ((!rel && yUnit) ? ' ' + yUnit : '') +
             ' · R² ' + pr2(allFit.r2)) +
         (rel ? '\n' + esc('곡선 관계라 직선 대신 ' + relTxt + ' 로 맞췄습니다.') : '') +
         (mine && mine.fit.ok
            ? '\n' + esc(gname(presenter) + ' 만 보면 ' + sWord + ' ' + pnum(mine.fit.slope) + (su ? ' ' + su : '') +
                         ' · R² ' + pr2(mine.fit.r2))
            : '') +
         (rankTxt ? '\n' + esc(rankTxt) : '') + '</p></div>';

    h += '<div class="tblwrap"><table class="ptbl"><thead><tr><th>모둠</th><th>점</th><th>' + esc(sWord) +
         (su ? ' (' + esc(su) + ')' : '') + '</th><th>R²</th></tr></thead><tbody>';
    parts.forEach(function(p){
      h += '<tr' + (p.mine ? ' class="me"' : '') + '>' +
           '<td><span class="swatch" style="background:' + p.color + '"></span>' + esc(p.name) + (p.mine ? ' (발표)' : '') + '</td>' +
           '<td>' + p.pts.length + '</td>' +
           '<td>' + esc(p.fit.ok ? pnum(p.fit.slope) : '—') + '</td>' +
           '<td>' + esc(p.fit.ok ? pr2(p.fit.r2) : '—') + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<div class="qa" style="border-left-color:var(--coral);background:#FFF7F4"><b>모둠마다 기울기가 다른 까닭은 무엇일까요?</b>' +
         '<p>측정 조건 · 도구 · 읽는 방법 가운데 무엇이 달랐는지 이야기해 봅시다.</p></div>';
    return h + '</div>';
  }

  // ── 시작 ───────────────────────────────────────────────────────
  // Hub.watch 는 실패해도 조용히 캐시를 내보내므로, 먼저 한 번 직접 확인해
  // 보관 기간이 지났거나 없는 코드일 때 이유를 화면에 띄웁니다.
  function start(code){
    joinCode = Hub.norm(code);
    if (joinCode.length !== 6){ $('askErr').textContent = '참여코드 6자리를 입력하세요.'; return; }
    $('askErr').textContent = '확인하는 중…';
    if (unwatch) { unwatch(); unwatch = null; }

    Hub.getLesson(joinCode).then(function(){
      $('askErr').textContent = '';
      Hub.saveLocal('last_present', joinCode);
      // 첫 화면은 캐시로 즉시 띄우고, 그 뒤 변경분을 따라갑니다.
      const cached = Hub.loadLocal('board_' + joinCode, null);
      if (cached) render(cached, { mode: 'cache' });
      unwatch = Hub.watch(joinCode, function(b, info){ render(b, info); });
    }, function(err){
      //  인터넷만 끊겼고 이 기기에 받아 둔 화면이 있으면 그것을 보여 주고 위쪽 띠로 알립니다(안내를 두 번 하지 않게).
      const cached = Hub.loadLocal('board_' + joinCode, null);
      if (err && err.offline && cached && cached.lesson){
        $('askErr').textContent = '';
        render(cached, { mode: 'cache' });
        unwatch = Hub.watch(joinCode, function(b, info){ render(b, info); });
        return;
      }
      if (err && err.expired)      return blockScreen('보관 기간이 지난 수업입니다',
        '이 수업은 만든 지 60일이 지나 학생 화면에서는 열리지 않습니다.<br>선생님이 <b>교사 화면 → 30일 연장</b>을 누르면 다시 열립니다.');
      if (err && err.offline)      return blockScreen('인터넷 연결을 확인해 주세요',
        '전자칠판이 인터넷에 연결되어 있는지 확인한 뒤 다시 시도해 주세요.');
      // 코드가 틀린 경우 등은 입력칸 옆에 짧게 알립니다.
      $('askErr').textContent = (err && err.message) || '수업을 찾을 수 없습니다. 참여코드를 확인해 주세요.';
    });
  }

  // 발표를 진행할 수 없을 때 뒷자리에서도 읽히게 큰 안내를 띄웁니다.
  // #screen 안에는 render() 가 쓰는 요소들이 있으므로 건드리지 않고,
  // 별도 영역을 만들어 그것만 보여 줍니다.
  function blockScreen(title, htmlBody){
    let el = $('blocked');
    if (!el){
      el = document.createElement('section');
      el.id = 'blocked';
      $('screen').parentNode.insertBefore(el, $('screen'));
    }
    $('ask').classList.add('hidden');
    $('screen').classList.add('hidden');
    el.classList.remove('hidden');
    //  큰 안내 하나만 — 위쪽 띠(연결 끊김·설정 안내)는 함께 띄우지 않습니다.
    $('setupbar').classList.add('hidden');
    paintOffbar();
    document.body.classList.remove('showing');
    el.innerHTML =
      '<div class="wrap" style="display:flex;align-items:center;justify-content:center;min-height:80vh">' +
        '<div class="bigcard" style="text-align:center;max-width:1000px">' +
          '<div style="font-size:72px;line-height:1;margin-bottom:18px" aria-hidden="true">🔒</div>' +
          '<h2 style="font-size:clamp(34px,4.4vw,64px)">' + esc(title) + '</h2>' +
          '<p style="font-size:clamp(20px,2vw,30px);line-height:1.7;color:var(--muted);margin-top:14px">' + htmlBody + '</p>' +
          '<button id="btnBack" class="btn" type="button" style="margin-top:26px;font-size:22px">참여코드 다시 입력</button>' +
        '</div></div>';
    $('btnBack').addEventListener('click', function(){
      el.classList.add('hidden');
      paintOffbar();
      $('ask').classList.remove('hidden');
      $('askErr').textContent = '';
      $('inCode').value = '';
      $('inCode').focus();
    });
  }

  //  칠판에서 '예상 vs 실제' 를 열어 보는 단추(이 화면에서만 잠깐 넘깁니다).
  $('pSlideBar').addEventListener('click', function(e){
    const b = e.target && e.target.closest ? e.target.closest('button[data-go]') : null;
    if (!b || !board) return;
    const go = b.getAttribute('data-go');
    localSlide = (go === 'back') ? null : Number(go);
    render(board, { mode: 'local' });
  });

  //  '반 전체 속 우리 모둠' 에서 계열 고르기 — 이 화면에서만 바꿔 봅니다(서버에 쓰지 않습니다).
  $('pStage').addEventListener('click', function(e){
    const b = e.target && e.target.closest ? e.target.closest('button[data-series]') : null;
    if (!b || !board) return;
    classSi = Math.max(0, Number(b.getAttribute('data-series')) || 0);
    render(board, { mode: 'local' });
  });

  $('inCode').addEventListener('input', function(){
    this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  });
  $('inCode').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('btnGo').click(); });
  $('btnGo').addEventListener('click', function(){ start($('inCode').value); });

  //  꼬리말 — 앱 이름과 config.js 의 이름(있을 때만)
  (function(){
    const C = window.MBL_CONFIG || {};
    const who = [C.TEACHER, C.SCHOOL].filter(function(x){ return x && String(x).trim(); }).join(' · ');
    if ($('creditWho')) $('creditWho').textContent = who ? ' · ' + who : '';
  })();

  //  주소에 ?code= 가 있으면 곧바로 엽니다. 지난번에 연 코드는 저절로 열지 않고 단추로 권합니다
  //  (다른 반 수업이 칠판에 갑자기 뜨지 않게).
  const q = new URLSearchParams(location.search).get('code');
  if (q && Hub.norm(q).length === 6){ $('inCode').value = Hub.norm(q); start(q); }
  else {
    if (q) $('askErr').textContent = '주소의 참여코드가 6자리가 아닙니다. 참여코드를 직접 입력해 주세요.';
    const last = Hub.norm(Hub.loadLocal('last_present', '') || '');
    if (last.length === 6){
      const box = $('resume');
      box.innerHTML = '지난번에 띄운 수업이 있습니다.<br><button id="btnResume" class="btn2" type="button">' + esc(last) + ' 다시 열기</button>';
      box.classList.remove('hidden');
      $('btnResume').addEventListener('click', function(){ $('inCode').value = last; start(last); });
    }
  }

})();
</script>
</body>
</html>
